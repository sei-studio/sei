<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" preserveAspectRatio="xMidYMid slice">
  <!-- 20 Questions tile art: periwinkle-on-dark, Summoning Terminal look
       (matches game-chess.svg / game-connect4.svg). -->
  <defs>
    <linearGradient id="tqbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a2e"/>
      <stop offset="1" stop-color="#04070f"/>
    </linearGradient>
    <radialGradient id="tqglow" cx="0.4" cy="0.32" r="0.9">
      <stop offset="0" stop-color="#b8d3ff"/>
      <stop offset="1" stop-color="#7fb0ff"/>
    </radialGradient>
  </defs>
  <rect width="560" height="320" fill="url(#tqbg)"/>

  <!-- Two speech bubbles trading questions, drawn in the same soft skew -->
  <g transform="translate(70 46) skewX(-6)">
    <!-- The asker's bubble with the big question mark -->
    <g>
      <rect x="0" y="0" width="200" height="132" fill="#0a1424" stroke="#7fb0ff" stroke-opacity="0.35" stroke-width="2"/>
      <path d="M 34 132 L 34 160 L 66 132 Z" fill="#0a1424" stroke="#7fb0ff" stroke-opacity="0.35" stroke-width="2"/>
      <text x="100" y="102" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="bold" fill="url(#tqglow)">?</text>
    </g>
    <!-- The answerer's smaller bubble: a firm yes-or-no dash of light -->
    <g transform="translate(238 74)">
      <rect x="0" y="0" width="128" height="84" fill="#0a1424" stroke="#7fb0ff" stroke-opacity="0.25" stroke-width="2"/>
      <path d="M 94 0 L 94 -24 L 66 0 Z" fill="#0a1424" stroke="#7fb0ff" stroke-opacity="0.25" stroke-width="2"/>
      <rect x="26" y="34" width="52" height="10" fill="#7fb0ff" fill-opacity="0.55"/>
      <rect x="86" y="34" width="16" height="10" fill="#7fb0ff" fill-opacity="0.25"/>
    </g>
  </g>

  <!-- The 20-question pip tracker: two rows of ten, part spent -->
  <g transform="translate(96 246) skewX(-6)">
    <g stroke="#7fb0ff" stroke-opacity="0.4" stroke-width="1.5">
      <!-- Row 1: seven spent (filled), three open -->
      <rect x="0"   y="0" width="22" height="22" fill="#7fb0ff" fill-opacity="0.85"/>
      <rect x="34"  y="0" width="22" height="22" fill="#7fb0ff" fill-opacity="0.85"/>
      <rect x="68"  y="0" width="22" height="22" fill="#7fb0ff" fill-opacity="0.85"/>
      <rect x="102" y="0" width="22" height="22" fill="#b8d3ff" fill-opacity="0.95"/>
      <rect x="136" y="0" width="22" height="22" fill="#7fb0ff" fill-opacity="0.85"/>
      <rect x="170" y="0" width="22" height="22" fill="#7fb0ff" fill-opacity="0.85"/>
      <rect x="204" y="0" width="22" height="22" fill="#7fb0ff" fill-opacity="0.85"/>
      <rect x="238" y="0" width="22" height="22" fill="none"/>
      <rect x="272" y="0" width="22" height="22" fill="none"/>
      <rect x="306" y="0" width="22" height="22" fill="none"/>
    </g>
    <g stroke="#7fb0ff" stroke-opacity="0.22" stroke-width="1.5" fill="none">
      <!-- Row 2: all still open -->
      <rect x="0"   y="34" width="22" height="22"/>
      <rect x="34"  y="34" width="22" height="22"/>
      <rect x="68"  y="34" width="22" height="22"/>
      <rect x="102" y="34" width="22" height="22"/>
      <rect x="136" y="34" width="22" height="22"/>
      <rect x="170" y="34" width="22" height="22"/>
      <rect x="204" y="34" width="22" height="22"/>
      <rect x="238" y="34" width="22" height="22"/>
      <rect x="272" y="34" width="22" height="22"/>
      <rect x="306" y="34" width="22" height="22"/>
    </g>
  </g>

  <!-- Soft glow accent -->
  <circle cx="430" cy="72" r="90" fill="#7fb0ff" opacity="0.06"/>
</svg>
