name: Velopack Windows update

# Windows updates on Velopack with Sei's fast apply (261030). Builds the
# patched Update.exe (build/velopack/README.md), packs this branch twice as
# Velopack releases (0.6.90 and 0.6.91, unsigned, never published) with the
# release scripts (scripts/velopack-pack.mjs + velopack-mirror.mjs into a
# local feed folder), and runs on clean windows-latest runners:
#   scenarios  every update scenario (scripts/velopack-ci/scenario.ps1); each
#              uploads its marks, logs, numbers and a video with a silent
#              audio track
#   migrate    the NSIS -> Velopack migration from a real old NSIS release
#              (scripts/velopack-ci/migrate.ps1)
#   authenticode  the signature check updates must pass (velopackSignature.ts)
#              against signed, unsigned, tampered and someone-else-signed files
#              and packages, and the real CI package (scripts/velopack-ci/
#              authenticode.ps1)
#   rollout-dry-run  velopack-rollout.yml itself, as a dry run against R2
#              (migration and repair switches)
#   e2e-signed  (dispatch only, suite=e2e-signed) the whole beta path on REAL
#              signed releases: NSIS install, NSIS update, migration, a
#              Velopack update and a forced self-repair, with the real
#              publisher check (scripts/velopack-ci/e2e-signed.ps1). Runs
#              alone: the jobs above are skipped for that suite.
#   mac-spike  (dispatch only, suite=mac-spike) Velopack on macOS measured on
#              an Apple Silicon runner against two real signed releases
#              (e2e_base_tag -> e2e_target_tag): today's Squirrel.Mac
#              differential, unzip and code-sign check vs a vpk delta,
#              UpdateMac's rebuild from it and its bundle swap. Measures only.
# Nothing here writes to dl.sei.gg or a GitHub release.
on:
  push:
    branches: ['feat/velopack-windows', 'dev', 'release/**']
    paths:
      - '.github/workflows/velopack-update.yml'
      - 'build/velopack/**'
      - 'scripts/velopack-ci/**'
      - 'scripts/velopack-*.mjs'
      - 'scripts/lib/velopack*.mjs'
      - '.github/actions/velopack-tools/**'
      - '.github/workflows/velopack-rollout.yml'
      - '.github/workflows/mirror-release.yml'
      - '.github/workflows/release.yml'
      - 'src/main/velopack*.ts'
      - 'src/main/winPowerShell.ts'
      - 'electron.vite.config.ts'
      - 'src/main/updater.ts'
      - 'src/main/windowChrome.ts'
      - 'src/main/index.ts'
      - 'electron-builder.yml'
      - 'package.json'
  workflow_dispatch:
    inputs:
      scenarios:
        description: 'Comma-separated scenarios (empty = all)'
        required: false
        default: ''
      suite:
        description: 'all = the branch build and its scenarios; e2e-signed = only the signed-release end to end; mac-spike = Velopack on macOS measured (e2e_base_tag -> e2e_target_tag)'
        type: choice
        options: [all, e2e-signed, mac-spike]
        default: all
      e2e_base_tag:
        description: 'e2e-signed: NSIS release the player starts on'
        type: string
        default: 'v0.7.0'
      e2e_from_tag:
        description: 'e2e-signed: beta the NSIS copy updates to and migrates from (its NSIS installer and Setup)'
        type: string
        default: ''
      e2e_target_tag:
        description: 'e2e-signed: beta the Velopack copy then updates to and repairs with (newer than from)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # Per suite: an e2e-signed dispatch must not cancel a branch run (or the reverse).
  group: velopack-update-${{ github.ref }}-${{ inputs.suite || 'all' }}
  cancel-in-progress: true

env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip
  # 261101: CI must never write to production analytics. These CI jobs
  # download and launch real releases (v0.6.4, v0.6.10), which send events
  # unless told otherwise: release builds bake no key, so analytics.ts reads
  # POSTHOG_KEY / POSTHOG_HOST at runtime, and a phc_REPLACE_WITH_ key counts as
  # unset. The builds made here bake the same values. In October these runs
  # wrote about 200 fake installs into PostHog from GitHub runner IPs (0.6.4,
  # 0.6.10, 0.6.90-0.6.93) and halved the 10-30 D1 cohort rate.
  POSTHOG_KEY: phc_REPLACE_WITH_ci_disabled
  POSTHOG_HOST: http://127.0.0.1:9
  SEI_ANALYTICS_DEV: '0'

jobs:
  lint:
    if: inputs.suite != 'e2e-signed' && inputs.suite != 'mac-spike'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color -shellcheck= .github/workflows/*.yml
      - name: Parse the CI scripts
        shell: pwsh
        run: |
          $bad = $false
          foreach ($f in 'scenario.ps1', 'migrate.ps1', 'testsign.ps1', 'authenticode.ps1', 'e2e-signed.ps1') {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/velopack-ci/$f", [ref]$null, [ref]$errs) | Out-Null
            if ($errs) { $bad = $true; $errs | ForEach-Object { Write-Host "::error::${f} line $($_.Extent.StartLineNumber): $($_.Message)" } } else { Write-Host "$f parses" }
          }
          if ($bad) { exit 1 }
      - name: Syntax-check the release scripts
        run: for f in scripts/velopack-*.mjs scripts/lib/velopack*.mjs scripts/velopack-ci/*.mjs; do node --check "$f"; done

  build:
    if: inputs.suite != 'e2e-signed' && inputs.suite != 'mac-spike'
    runs-on: windows-latest
    timeout-minutes: 100
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Python (distutils for headless-gl native build)
        uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: '3.11'

      - name: Velopack tools (patched Update.exe + vpk)
        uses: ./.github/actions/velopack-tools

      - name: Install dependencies
        env:
          npm_config_python: ${{ steps.setup-python.outputs.python-path }}
        run: npm ci

      - name: Build and pack 0.6.90 and 0.6.91
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # CI builds must not send product analytics (analytics.ts keyConfigured).
          POSTHOG_KEY: phc_REPLACE_WITH_ci_disabled
        shell: bash
        run: |
          set -euo pipefail
          # Outputs live OUTSIDE the checkout: electron-builder packs "**/*".
          OUT="$(cygpath -m "$RUNNER_TEMP")/vpout"; mkdir -p "$OUT/vp" "$OUT/nsis" "$OUT/timing"
          npx electron-vite build
          if grep -rqF phc_srnfn2HQ dist/main; then echo "::error::the production PostHog key is in a CI build"; exit 1; fi
          for v in 0.6.90 0.6.91; do
            npm pkg set version=$v
            rm -rf release/win-unpacked
            t0=$(date +%s)
            npx electron-builder --win dir --x64 --publish never > "$OUT/timing/eb-$v.log" 2>&1 || { tail -50 "$OUT/timing/eb-$v.log"; exit 1; }
            t1=$(date +%s)
            if [ "$v" = 0.6.90 ]; then
              # The first Velopack release of a feed: stable only, no delta.
              node scripts/velopack-pack.mjs --version $v --app release/win-unpacked --out "$OUT/pack-$v" --channels win
            else
              # Channels and the delta base come from the feed, as in release.yml.
              node scripts/velopack-pack.mjs --version $v --app release/win-unpacked --out "$OUT/pack-$v" --prev-feed "dir:$OUT/vp"
            fi
            t2=$(date +%s)
            node scripts/velopack-mirror.mjs --assets "$OUT/pack-$v/upload" --tag v$v --store "dir:$OUT/vp"
            if [ "$v" = 0.6.90 ]; then
              # The NSIS installer of the same build, for the migration scenarios.
              npx electron-builder --win nsis --x64 --prepackaged release/win-unpacked --publish never > "$OUT/timing/nsis-$v.log" 2>&1 || { tail -50 "$OUT/timing/nsis-$v.log"; exit 1; }
              mv release/Sei-win-x64.exe "$OUT/nsis/Sei-$v-nsis.exe"
            fi
            cp "$OUT"/pack-$v/vpk-*.log "$OUT/timing/" 2>/dev/null || true
            echo "$v electron-builder-dir=$((t1-t0))s velopack-pack=$((t2-t1))s" | tee -a "$OUT/timing/summary.txt"
            rm -rf "$OUT/pack-$v"
          done
          echo "win-unpacked: $(find release/win-unpacked -type f | wc -l) files, $(du -sb release/win-unpacked | cut -f1) bytes" | tee -a "$OUT/timing/summary.txt"
          find "$OUT/vp" "$OUT/nsis" -type f -printf '%10s %p\n' | sort -k2 | tee -a "$OUT/timing/summary.txt"
          for f in releases.win.json releases.beta.json setup.win.json setup.beta.json; do echo "--- $f"; cat "$OUT/vp/$f"; done
          # The feed the client reads, as the release scripts left it.
          node -e '
            const fs = require("fs"), d = process.argv[1];
            const j = (f) => JSON.parse(fs.readFileSync(d + "/" + f, "utf8"));
            const win = j("releases.win.json").Assets.map((a) => a.Version + "/" + a.Type).sort().join(" ");
            const beta = j("releases.beta.json").Assets.map((a) => a.Version + "/" + a.Type).sort().join(" ");
            const fail = (m) => { console.log("::error::" + m); process.exit(1); };
            if (win !== "0.6.90/Full 0.6.91/Delta 0.6.91/Full") fail("releases.win.json lists " + win);
            if (beta !== "0.6.91/Full") fail("releases.beta.json lists " + beta);
            if (j("setup.win.json").version !== "0.6.91" || j("setup.beta.json").version !== "0.6.91") fail("setup manifests are not at 0.6.91");
            for (const f of ["setup/v0.6.90/Sei-win-Setup.exe", "setup/v0.6.91/Sei-win-Setup.exe", "setup/v0.6.91/Sei-beta-Setup.exe", "Sei-0.6.91-beta-full.nupkg"])
              if (!fs.existsSync(d + "/" + f)) fail("missing " + f);
            console.log("feed OK");
          ' "$OUT/vp"

      - uses: actions/upload-artifact@v4
        with:
          name: velopack-feed
          # The beta channel is checked above; no scenario installs it.
          path: |
            ${{ runner.temp }}/vpout/vp
            ${{ runner.temp }}/vpout/nsis
            !${{ runner.temp }}/vpout/vp/*-beta-*.nupkg
            !${{ runner.temp }}/vpout/vp/setup/*/Sei-beta-Setup.exe
          retention-days: 7

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: velopack-build-timing
          path: ${{ runner.temp }}/vpout/timing
          retention-days: 7

  migrate:
    needs: [lint, build]
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        case: [peruser-default, peruser-custom, peruser-unicode, permachine, setup-killed, sig-reject, nsis-newer, update-exe-missing]
    steps:
      # 261101: block PostHog before anything here launches Sei. The runtime
      # env above stops a release binary from sending, but the hosts entries
      # also cover processes that do not inherit it. The job fails if the
      # block does not take.
      - name: Block product analytics
        shell: pwsh
        run: |
          $hosts = Join-Path $env:SystemRoot 'System32\drivers\etc\hosts'
          $names = 'us.i.posthog.com', 'us-assets.i.posthog.com', 'us.posthog.com', 'app.posthog.com', 'eu.i.posthog.com'
          Add-Content -Path $hosts -Value ($names | ForEach-Object { "0.0.0.0 $_"; ":: $_" })
          ipconfig /flushdns | Out-Null
          foreach ($n in $names) {
            $a = @(try { [System.Net.Dns]::GetHostAddresses($n) | ForEach-Object { $_.ToString() } } catch { })
            $live = @($a | Where-Object { $_ -ne '0.0.0.0' -and $_ -ne '::' })
            if ($live.Count) { Write-Output "::error::$n still resolves to $($live -join ', ')"; exit 1 }
          }
          "PostHog hosts blocked: $($names -join ', ')"

      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            scripts/velopack-ci
            scripts/lib
            scripts/velopack-rollout.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          name: velopack-feed
          path: feed

      - name: Download the old NSIS release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        # v0.6.10 is a one-click per-user installer and ignores /allusers.
        # Per-machine installs in the field come from the older assisted
        # installers, so that case starts from v0.6.4.
        run: |
          $tag = if ('${{ matrix.case }}' -eq 'permachine') { 'v0.6.4' } else { 'v0.6.10' }
          "old NSIS release: $tag"
          gh release download $tag -R $env:GITHUB_REPOSITORY -p 'Sei-win-x64.exe' -D old

      - name: Migrate (${{ matrix.case }})
        shell: pwsh
        run: ./scripts/velopack-ci/migrate.ps1 -Case '${{ matrix.case }}' -Feed feed -Old old -Out out

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migrate-${{ matrix.case }}
          path: out
          retention-days: 14

  authenticode:
    needs: [lint, build]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /package.json
            scripts/velopack-ci
            src/main/velopackSignature.ts
            src/main/winPowerShell.ts
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: velopack-feed
          path: feed

      - name: Authenticode cases
        # Windows PowerShell 5.1: the PKI cmdlets, and the PowerShell Sei runs
        # the check in.
        shell: powershell
        run: ./scripts/velopack-ci/authenticode.ps1 -Feed feed

  rollout-dry-run:
    needs: lint
    uses: ./.github/workflows/velopack-rollout.yml
    with:
      channel: win
      kind: migration
      percent: '0'
      dry_run: true
    secrets: inherit

  rollout-dry-run-repair:
    needs: lint
    uses: ./.github/workflows/velopack-rollout.yml
    with:
      channel: win
      kind: repair
      percent: '100'
      dry_run: true
    secrets: inherit

  scenarios:
    needs: [lint, build]
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - restart
          - restart-defender-off
          - restart-norec
          - restart-unstaged
          - rollback-swap1
          - rollback-swap2
          - launch-during-apply
          - quit
          - next-launch
          - low-disk
          - rollout
          - sig-reject
          - sig-accept
          - restart-spawn-fail
          - session-end
          - repair-update-missing
          - repair-update-missing-safe
          - repair-update-missing-unicode
          - repair-update-corrupt
          - repair-packages-corrupt
          - repair-apply-fails
          - repair-apply-fails-safe
    steps:
      # 261101: block PostHog before anything here launches Sei. The runtime
      # env above stops a release binary from sending, but the hosts entries
      # also cover processes that do not inherit it. The job fails if the
      # block does not take.
      - name: Block product analytics
        shell: pwsh
        run: |
          $hosts = Join-Path $env:SystemRoot 'System32\drivers\etc\hosts'
          $names = 'us.i.posthog.com', 'us-assets.i.posthog.com', 'us.posthog.com', 'app.posthog.com', 'eu.i.posthog.com'
          Add-Content -Path $hosts -Value ($names | ForEach-Object { "0.0.0.0 $_"; ":: $_" })
          ipconfig /flushdns | Out-Null
          foreach ($n in $names) {
            $a = @(try { [System.Net.Dns]::GetHostAddresses($n) | ForEach-Object { $_.ToString() } } catch { })
            $live = @($a | Where-Object { $_ -ne '0.0.0.0' -and $_ -ne '::' })
            if ($live.Count) { Write-Output "::error::$n still resolves to $($live -join ', ')"; exit 1 }
          }
          "PostHog hosts blocked: $($names -join ', ')"

      - name: Skip unless selected
        id: sel
        shell: bash
        run: |
          s="${{ github.event.inputs.scenarios }}"
          if [ -z "$s" ] || [[ ",$s," == *",${{ matrix.scenario }},"* ]]; then echo "run=1" >> "$GITHUB_OUTPUT"; else echo "run=0" >> "$GITHUB_OUTPUT"; fi

      - if: steps.sel.outputs.run == '1'
        uses: actions/checkout@v6
        with:
          sparse-checkout: scripts/velopack-ci

      - if: steps.sel.outputs.run == '1'
        uses: actions/download-artifact@v4
        with:
          name: velopack-feed
          path: feed

      - name: ffmpeg (screen recording)
        if: steps.sel.outputs.run == '1' && matrix.scenario != 'restart-norec'
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          Invoke-WebRequest 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip' -OutFile $zip
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'ffmpeg')
          $bin = (Get-ChildItem (Join-Path $env:RUNNER_TEMP 'ffmpeg') -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          Add-Content $env:GITHUB_PATH $bin

      - name: Run ${{ matrix.scenario }}
        if: steps.sel.outputs.run == '1'
        shell: pwsh
        run: ./scripts/velopack-ci/scenario.ps1 -Scenario '${{ matrix.scenario }}' -Feed feed -Out out

      - if: always() && steps.sel.outputs.run == '1'
        uses: actions/upload-artifact@v4
        with:
          name: scenario-${{ matrix.scenario }}
          path: out
          retention-days: 14

  # The beta fast-update path on REAL signed releases (product call (261126)):
  # what scenarios/migrate prove on unsigned branch builds, here with the
  # packages release.yml built, signed and packed, so the Authenticode checks
  # run against the publisher baked into the release. Two variants:
  #   nsis-update  base NSIS -> NSIS update to from (as electron-updater runs
  #                it) -> migration to the from Setup -> Velopack update to
  #                target (Full) -> forced self-repair
  #   delta        base NSIS -> migration to the base Setup -> Velopack update
  #                to target with the release's own Delta (its base is the
  #                newest version in the live beta feed when target was built,
  #                so pass a base that was) -> forced self-repair
  # Nothing is published or written to dl.sei.gg: the feed is a local copy.
  e2e-signed:
    if: inputs.suite == 'e2e-signed'
    runs-on: windows-latest
    timeout-minutes: 75
    # Draft releases (unpublished betas) are only visible with push access.
    # The token is used by the download step alone; nothing here writes.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        variant: [nsis-update, delta]
    steps:
      - name: Block product analytics
        shell: pwsh
        run: |
          $hosts = Join-Path $env:SystemRoot 'System32\drivers\etc\hosts'
          $names = 'us.i.posthog.com', 'us-assets.i.posthog.com', 'us.posthog.com', 'app.posthog.com', 'eu.i.posthog.com'
          Add-Content -Path $hosts -Value ($names | ForEach-Object { "0.0.0.0 $_"; ":: $_" })
          ipconfig /flushdns | Out-Null
          foreach ($n in $names) {
            $a = @(try { [System.Net.Dns]::GetHostAddresses($n) | ForEach-Object { $_.ToString() } } catch { })
            $live = @($a | Where-Object { $_ -ne '0.0.0.0' -and $_ -ne '::' })
            if ($live.Count) { Write-Output "::error::$n still resolves to $($live -join ', ')"; exit 1 }
          }
          "PostHog hosts blocked: $($names -join ', ')"

      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: scripts/velopack-ci

      - name: Download the signed releases
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ inputs.e2e_base_tag }}
          FROM: ${{ inputs.e2e_from_tag }}
          TARGET: ${{ inputs.e2e_target_tag }}
          VARIANT: ${{ matrix.variant }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:BASE -or -not $env:TARGET -or ($env:VARIANT -eq 'nsis-update' -and -not $env:FROM)) {
            Write-Output '::error::e2e_base_tag and e2e_target_tag are required (and e2e_from_tag for nsis-update)'; exit 1
          }
          $all = (gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100") -join "`n" | ConvertFrom-Json
          # A tag can have a full draft and a partial duplicate: take the one with the most assets.
          function Rel([string]$tag) {
            $r = @($all | Where-Object { $_.tag_name -eq $tag } | Sort-Object { $_.assets.Count } -Descending)[0]
            if (-not $r) { throw "no release $tag" }
            "$tag -> release $($r.id) ($(if ($r.draft) { 'draft' } else { 'published' }), $($r.assets.Count) assets)"
            $r
          }
          function Get-Asset($r, [string]$name, [string]$dir, [switch]$Optional) {
            $a = @($r.assets | Where-Object { $_.name -like $name })
            if ($a.Count -eq 0) { if ($Optional) { return }; throw "$($r.tag_name) has no asset $name" }
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            foreach ($x in $a) {
              $dest = Join-Path $dir $x.name
              # curl, not gh api: pwsh pipes text, which would corrupt a binary.
              curl.exe -fsSL -H "Authorization: Bearer $env:GH_TOKEN" -H 'Accept: application/octet-stream' -o $dest "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/assets/$($x.id)"
              if ($LASTEXITCODE -ne 0) { throw "download of $($x.name) failed" }
              if ((Get-Item $dest).Length -ne $x.size) { throw "$($x.name): $((Get-Item $dest).Length) bytes, expected $($x.size)" }
              "  $($x.name) $([math]::Round($x.size / 1MB, 1)) MB"
            }
          }
          $base = Rel $env:BASE; $target = Rel $env:TARGET
          Get-Asset $base 'Sei-win-x64.exe' 'rel/base'
          if ($env:VARIANT -eq 'nsis-update') {
            $from = Rel $env:FROM
            Get-Asset $from 'Sei-win-x64.exe' 'rel/nsis'
          } else {
            $from = $base
          }
          Get-Asset $from 'Sei-beta-Setup.exe' 'rel/from'
          Get-Asset $from 'setup.beta.json' 'rel/from'
          foreach ($n in 'Sei-beta-Setup.exe', 'setup.beta.json', 'releases.beta.json', '*-beta-full.nupkg') { Get-Asset $target $n 'rel/target' }
          if ($env:VARIANT -eq 'delta') { Get-Asset $target '*-beta-delta.nupkg' 'rel/target' }

      # From here on the app must not see the live feeds: a beta published
      # mid-run would otherwise be offered to the NSIS copy and hold the
      # migration (update-pending). sei.gg's policy feed stays reachable.
      - name: Block the live update feeds
        shell: pwsh
        run: |
          $hosts = Join-Path $env:SystemRoot 'System32\drivers\etc\hosts'
          $names = 'github.com', 'dl.sei.gg'
          Add-Content -Path $hosts -Value ($names | ForEach-Object { "0.0.0.0 $_"; ":: $_" })
          ipconfig /flushdns | Out-Null
          "blocked: $($names -join ', ')"

      - name: End to end (${{ matrix.variant }})
        shell: pwsh
        run: ./scripts/velopack-ci/e2e-signed.ps1 -Rel rel -Out out ${{ matrix.variant == 'delta' && '-UseDelta' || '' }}

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-signed-${{ matrix.variant }}
          path: out
          retention-days: 14

  mac-spike:
    if: inputs.suite == 'mac-spike'
    runs-on: macos-latest
    timeout-minutes: 45
    # Draft releases are only visible with push access.
    permissions:
      contents: write
    steps:
      - name: Block product analytics
        run: |
          printf '127.0.0.1 us.i.posthog.com\n127.0.0.1 us-assets.i.posthog.com\n127.0.0.1 app.posthog.com\n' | sudo tee -a /etc/hosts >/dev/null

      - name: Download both releases
        env:
          GH_TOKEN: ${{ github.token }}
          FROM_TAG: ${{ inputs.e2e_base_tag }}
          TO_TAG: ${{ inputs.e2e_target_tag || 'v0.7.1-beta.2' }}
        run: |
          set -euo pipefail
          mkdir -p rel/from rel/to
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > releases.json
          for side in from to; do
            if [ "$side" = from ]; then tag="$FROM_TAG"; else tag="$TO_TAG"; fi
            # The release with the most assets for the tag (a partial duplicate draft has fewer).
            for name in Sei-mac-arm64.zip Sei-mac-arm64.zip.blockmap; do
              id=$(jq -r --arg t "$tag" --arg n "$name" '[.[] | select(.tag_name == $t)] | sort_by(.assets | length) | last | .assets[] | select(.name == $n) | .id' releases.json)
              if [ -z "$id" ] || [ "$id" = null ]; then echo "::error::$tag has no $name"; exit 1; fi
              curl -sfL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/octet-stream' \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$id" -o "rel/$side/$name"
            done
            ls -la "rel/$side"
          done

      - name: Today (Squirrel.Mac) - differential, unzip, code-sign check
        run: |
          set -euo pipefail
          npm init -y >/dev/null
          npm install --no-audit --no-fund electron-updater@6.8.3 >/dev/null 2>&1
          cat > bm.cjs <<'EOF'
          const zlib = require('zlib'), fs = require('fs');
          const { computeOperations, OperationKind } = require('electron-updater/out/differentialDownloader/downloadPlanBuilder.js');
          const rd = (f) => JSON.parse(zlib.gunzipSync(fs.readFileSync(f)));
          const o = rd('rel/from/Sei-mac-arm64.zip.blockmap'), n = rd('rel/to/Sei-mac-arm64.zip.blockmap');
          const ops = computeOperations(o, n, { info() {}, warn() {}, debug() {} });
          let dl = 0; for (const op of ops) if (op.kind === OperationKind.DOWNLOAD) dl += op.end - op.start;
          console.log(JSON.stringify({ differential_mb: +(dl / 1e6).toFixed(1), full_zip_mb: +(fs.statSync('rel/to/Sei-mac-arm64.zip').size / 1e6).toFixed(1) }));
          EOF
          node bm.cjs > today-dl.json
          mkdir -p unz/from unz/to
          t0=$(python3 -c 'import time; print(time.time())')
          ditto -x -k rel/to/Sei-mac-arm64.zip unz/to
          t1=$(python3 -c 'import time; print(time.time())')
          codesign --verify --deep --strict unz/to/Sei.app
          t2=$(python3 -c 'import time; print(time.time())')
          ditto -x -k rel/from/Sei-mac-arm64.zip unz/from
          spctl -a -vv unz/to/Sei.app 2>&1 | sed -E 's/(origin=).*/\1<signer>/' || true
          python3 - "$t0" "$t1" "$t2" <<'EOF' > today-prep.json
          import json, sys
          t0, t1, t2 = map(float, sys.argv[1:])
          print(json.dumps({"unzip_ms": round((t1 - t0) * 1000), "codesign_verify_ms": round((t2 - t1) * 1000)}))
          EOF
          cat today-dl.json today-prep.json
          du -sm unz/to/Sei.app

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install vpk
        env:
          VPK_VERSION: 1.3.39-g8d2844f
        run: |
          set -euo pipefail
          dotnet tool install -g vpk --version "$VPK_VERSION"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Proposed (Velopack) - pack both, delta
        env:
          FROM_TAG: ${{ inputs.e2e_base_tag }}
          TO_TAG: ${{ inputs.e2e_target_tag || 'v0.7.1-beta.2' }}
        run: |
          set -euo pipefail
          from="${FROM_TAG#v}"; to="${TO_TAG#v}"
          mkdir -p vp
          for side in from to; do
            if [ "$side" = from ]; then v="$from"; else v="$to"; fi
            t0=$(python3 -c 'import time; print(time.time())')
            vpk --skip-updates pack -u Sei -v "$v" -p "unz/$side/Sei.app" -e Sei \
              --packTitle Sei --packAuthors Sei --channel osx --noInst \
              -o vp 2>&1 | tail -25
            t1=$(python3 -c 'import time; print(time.time())')
            echo "pack $side: $(python3 -c "print(round(($t1-$t0)*1000))") ms"
            # The portable zip is rewritten by each pack: keep FROM's to install from.
            cp "vp/Sei-osx-Portable.zip" "portable-$side.zip"
          done
          ls -la vp

      - name: Proposed (Velopack) - rebuild from the delta, apply the update
        env:
          FROM_TAG: ${{ inputs.e2e_base_tag }}
          TO_TAG: ${{ inputs.e2e_target_tag || 'v0.7.1-beta.2' }}
        run: |
          set -euo pipefail
          from="${FROM_TAG#v}"; to="${TO_TAG#v}"
          full_from="vp/Sei-$from-osx-full.nupkg"; full_to="vp/Sei-$to-osx-full.nupkg"; delta="vp/Sei-$to-osx-delta.nupkg"
          ls "$full_from" "$full_to" "$delta"
          # The installed copy: FROM's bundle out of its full package, in ~/Applications.
          # Installed the way a user would: FROM's portable zip into ~/Applications.
          mkdir -p "$HOME/Applications" inst
          ditto -x -k portable-from.zip inst
          app_src=$(find inst -maxdepth 2 -name '*.app' -type d | head -1)
          if [ -z "$app_src" ]; then echo "::error::no .app in FROM's portable zip"; find inst -maxdepth 3 | head -40; exit 1; fi
          rm -rf "$HOME/Applications/Sei.app"
          ditto "$app_src" "$HOME/Applications/Sei.app"
          upd="$HOME/Applications/Sei.app/Contents/MacOS/UpdateMac"
          ls -la "$HOME/Applications/Sei.app/Contents/MacOS"
          [ -x "$upd" ] || { echo "::error::no UpdateMac in the installed bundle"; exit 1; }
          now() { python3 -c 'import time; print(time.time())'; }
          t0=$(now)
          "$upd" patch --old "$full_from" --delta "$delta" --output rebuilt.nupkg --verbose 2>&1 | tail -15
          t1=$(now)
          ls -la rebuilt.nupkg "$full_to"
          t2=$(now)
          "$upd" apply --norestart --silent --verbose --package "$PWD/rebuilt.nupkg" 2>&1 | tail -40 || echo "apply exited $?"
          t3=$(now)
          plutil -extract CFBundleShortVersionString raw "$HOME/Applications/Sei.app/Contents/Info.plist" || true
          head -20 "$HOME/Applications/Sei.app/Contents/MacOS/sq.version" 2>/dev/null || true
          python3 - "$t0" "$t1" "$t2" "$t3" "$full_from" "$full_to" "$delta" <<'EOF' > proposed.json
          import json, os, sys
          t0, t1, t2, t3 = map(float, sys.argv[1:5])
          ff, ft, d = sys.argv[5:8]
          mb = lambda p: round(os.path.getsize(p) / 1e6, 1)
          print(json.dumps({"full_mb": mb(ft), "delta_mb": mb(d), "delta_rebuild_ms": round((t1 - t0) * 1000), "apply_ms": round((t3 - t2) * 1000)}))
          EOF
          cat proposed.json

      - name: Summary
        if: always()
        run: |
          python3 - <<'EOF'
          import json, os
          def rd(f):
              try: return json.load(open(f))
              except Exception: return {}
          out = {"today": {**rd("today-dl.json"), **rd("today-prep.json")}, "proposed": rd("proposed.json")}
          json.dump(out, open("spike.json", "w"), indent=1)
          lines = ["## Velopack mac spike", "", "| | value |", "|---|---|"]
          for side, d in out.items():
              for k, v in d.items(): lines.append(f"| {side} {k} | {v} |")
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write("\n".join(lines) + "\n")
          print(json.dumps(out, indent=1))
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: velopack-mac-spike
          path: |
            spike.json
            vp/*.json
          if-no-files-found: ignore
