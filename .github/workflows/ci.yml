name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

# Cancel superseded runs — a force-push to a PR branch would otherwise stack
# builds behind the stale one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      # headless-gl (vision render path) builds from source via node-gyp, which needs
      # a distutils-capable Python (removed from 3.12+). Provide 3.11 on every runner.
      - name: Setup Python (distutils for headless-gl native build)
        uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: '3.11'

      # postinstall rebuilds native modules against Electron's ABI
      # (electron-builder install-app-deps), which compiles the gl package
      # from source on linux — that needs X11/GL headers the ubuntu runner
      # image doesn't ship.
      - name: Install headless-gl build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libxi-dev libglu1-mesa-dev libglew-dev
          # bsdtar, for the platform-neutral game pack build below.
          sudo apt-get install -y libarchive-tools

      - name: Install dependencies
        env:
          npm_config_python: ${{ steps.setup-python.outputs.python-path }}
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Validate game pack workspace (dry run)
        # 260908: resolves the packs/minecraft workspace's production closure
        # from the hoisted tree, compiles every prune glob against it and
        # checks the must-keep paths. No native rebuild, no zip; ~10s.
        run: npm run check:packs

      - name: Build + verify the platform-neutral game packs
        # 260924: v0.6.5-beta.1 shipped a DST pack with no mod in it (the zip
        # step dropped assets/). The DST and Stardew packs need no native
        # rebuild and no game install (Stardew wraps the checked-in mod
        # build), so build them for real on every push: the builder re-reads
        # each zip and fails when it does not hold the hashed tree and the
        # game's required payload (scripts/lib/gamePackVerify.mjs).
        run: |
          node scripts/build-game-pack.mjs dontstarve --platform any --arch any --out "$RUNNER_TEMP/packs"
          node scripts/build-game-pack.mjs stardew --platform any --arch any --skip-build --out "$RUNNER_TEMP/packs"
          ls -la "$RUNNER_TEMP/packs"

  # 260925 backseat act (M0 spike): the macOS input helper only compiles on
  # macOS, and nothing else in CI runs there. Build it (universal, same script
  # predev/predist use) and drive its query protocol. The hosted runner is
  # Accessibility-trusted, so the player-takes-over abort check runs for real
  # and is REQUIRED.
  mac-input-helper:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Build helper
        # Strict here: a release build skips the helper on a compile failure
        # (the feature reports unavailable), CI must not.
        env:
          SEI_MAC_INPUT_STRICT: '1'
        run: |
          swiftc --version
          bash scripts/build-mac-input.sh
          lipo -archs resources/mac-input/sei-mac-input

      - name: Smoke test
        run: node scripts/smoke-mac-input.mjs resources/mac-input/sei-mac-input

      # User input must stop an action mid-way: our own tagged events must not
      # trip the watcher, and one untagged key or mouse event during a long
      # type or a hold must cancel it within 100 ms (helper clock).
      - name: Abort on player input
        run: node scripts/smoke-mac-input.mjs resources/mac-input/sei-mac-input --abort

      # The hosted runner reports Accessibility and Screen Recording as
      # granted, so real injection, AX and OCR can be exercised end to end.
      # Informational: GUI state on a hosted runner is not ours to control.
      - name: End-to-end (TextEdit)
        continue-on-error: true
        run: node scripts/smoke-mac-input.mjs resources/mac-input/sei-mac-input --act --e2e
