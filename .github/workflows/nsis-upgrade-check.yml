name: NSIS Upgrade Check

# Manual check for the Windows installer (260929, one-click switch). Builds this
# branch's one-click NSIS installer UNSIGNED, then on clean windows-latest
# runners installs the current STABLE release the way real users did, writes a
# marker into userData, and runs the new installer over the top with the exact
# arguments electron-updater passes. It asserts one Apps & features entry, the
# same install folder, an intact userData marker, and that the upgraded Sei.exe
# starts. It also prints the Authenticode signature of the stable installer and
# app (SmartScreen evidence).
#
# The two update paths and their arguments (src/main/updateInstall.ts):
#   in-app "Update Sei"  quitAndInstall(false, true) = --updated --force-run
#                        (261030; it was --updated /S --force-run from 261023)
#                        the one-click "Installing, please wait" progress
#                        window MUST show, with nothing to click, and Sei must
#                        REOPEN by itself
#   update on quit       autoInstallOnAppQuit        = --updated /S
#                        no installer window, Sei must NOT reopen
# Every upgrade run watches for visible windows. On the in-app path the
# installer's own window is expected (time to first window = how long the user
# sees nothing), but a window from any other process fails the run, and so
# does any enabled button inside the installer's windows (UI Automation): the
# progress banner has none, so a button means an error box, a "close Sei" box
# or a wizard page. On the update-on-quit path any window fails. Each run also
# times the installer start to Sei being back ("relaunched after Ns").
# peruser-default uploads screenshots of the in-app path (oneclick-upgrade-shots).
#
# Scenarios (the old ASSISTED installer's reachable choices):
#   peruser-default  per-user, default folder (%LOCALAPPDATA%\Programs\Sei),
#                    in-app restart
#   peruser-custom   per-user, a folder the user picked (with a space in it),
#                    in-app restart
#   peruser-running  per-user, in-app restart while the old Sei is STILL
#                    RUNNING (the real handoff: Sei spawns the installer, then
#                    quits; the installer's CHECK_APP_RUNNING closes it if it
#                    has not exited yet)
#   peruser-quit     per-user, update on quit: must not reopen Sei
#   permachine       "Anyone who uses this computer": HKLM + Program Files,
#                    removed by build/installer.nsh customInstall on the in-app
#                    restart (not silent, so user-started; --force-run would
#                    also count). Asserts the HKCU try-once marker is set.
#   permachine-silent  same install, update on quit (--updated /S, no
#                    --force-run): the per-machine copy must be LEFT alone and
#                    the marker left unset, so the attempt waits for an
#                    in-app restart or a manual install
#   permachine-tried   same install, marker pre-set (cleanup already tried
#                    once, say a declined UAC prompt): the in-app restart must
#                    not try again
#   fresh            no prior install: checks the default one-click location and
#                    that the install marker reads 'fresh' (installer_first_launch)
#
# Runner caveat: GitHub's Windows runners are admin with UAC off, so the admin
# prompt a real per-machine user sees for the old uninstaller cannot appear here.
#
# Sei's own update progress window (261030, src/main/updateProgressHelper.ts,
# resources/update-progress/update-progress.ps1), recorded as VIDEO
# (ffmpeg gdigrab) plus stills, by scripts/ci/update-progress-check.ps1:
#   progress-upgrade  the real path: the stable release installed and running,
#                     the window started through the real launcher
#                     (scripts/ci/update-progress-launch.ts), then this branch's
#                     installer with `--updated /S --force-run` under it, the
#                     arguments of quitAndInstall(true, true). Asserts the window
#                     is up inside the ready budget (12 s, 20 s once WPF loaded),
#                     no installer window, Sei back, the window gone once Sei's
#                     window shows, the bundled fonts in use, the window in the
#                     bottom-right corner of the work area. Artifact update-progress-upgrade.
#   progress-preview  stand-in installer and Sei (compiled on the runner, no
#                     build needed), one run per theme/language, one with
#                     animations off (reduced motion), one running past its
#                     estimate ("taking longer"), and `blocked`: a machine
#                     ExecutionPolicy (what a Group Policy sets) must make the
#                     launcher report not-ready fast, i.e. the stock installer
#                     window fallback. Artifacts update-progress-<variant>.
# Dispatch with suite=progress to run only these (and the build), or
# suite=preview for progress-preview alone (no build, a few minutes).
#
# Run it from the Actions tab (workflow_dispatch), or push to a nsischeck/**
# branch. It never publishes anything.
on:
  push:
    branches: ['nsischeck/**']
  workflow_dispatch:
    inputs:
      stable_tag:
        description: 'Stable release to upgrade from'
        required: false
        default: 'v0.6.4'
      suite:
        description: 'all = every scenario; progress = only the update progress window jobs; preview = only the stand-in progress previews (no build)'
        required: false
        default: 'all'
        type: choice
        options: [all, progress, preview]

permissions:
  contents: read

env:
  STABLE_TAG: ${{ inputs.stable_tag || 'v0.6.4' }}

jobs:
  build:
    if: inputs.suite != 'preview'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Python (distutils for headless-gl native build)
        uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: '3.11'

      - name: Install dependencies
        env:
          npm_config_python: ${{ steps.setup-python.outputs.python-path }}
        run: npm ci

      - name: Build unsigned one-click installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        shell: bash
        run: |
          npx electron-vite build
          npx electron-builder --win nsis --x64 --publish never
          ls -la release/

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: oneclick-installer
          path: release/Sei-win-x64.exe
          retention-days: 3

  upgrade:
    needs: build
    if: inputs.suite != 'progress' && inputs.suite != 'preview'
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scenario: [peruser-default, peruser-custom, peruser-running, peruser-quit, permachine, permachine-silent, permachine-tried, fresh]
    steps:
      - name: Download new installer
        uses: actions/download-artifact@v4
        with:
          name: oneclick-installer
          path: new

      - name: Download stable installer
        if: matrix.scenario != 'fresh'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release download $env:STABLE_TAG -R $env:GITHUB_REPOSITORY -p 'Sei-win-x64.exe' -D old
          Get-ChildItem old

      - name: Signature of the stable installer (SmartScreen evidence)
        if: matrix.scenario == 'peruser-default'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature old\Sei-win-x64.exe
          $sig | Format-List Status, StatusMessage, SignatureType, IsOSBinary
          if ($sig.SignerCertificate) {
            $sig.SignerCertificate | Format-List Subject, Issuer, Thumbprint, NotBefore, NotAfter
          }
          if ($sig.TimeStamperCertificate) {
            'Timestamper:'
            $sig.TimeStamperCertificate | Format-List Subject, Issuer, NotAfter
          } else { 'No timestamp countersignature.' }

      - name: Run the upgrade check
        shell: pwsh
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          $ErrorActionPreference = 'Stop'
          $failures = @()

          function Get-SeiEntries {
            $roots = @(
              'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall',
              'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall',
              'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall'
            )
            foreach ($r in $roots) {
              if (-not (Test-Path $r)) { continue }
              Get-ChildItem $r | ForEach-Object {
                $p = Get-ItemProperty $_.PSPath
                if ($p.DisplayName -like 'Sei*') {
                  [pscustomobject]@{ Root = $r; Key = $_.PSChildName; DisplayName = $p.DisplayName; Version = $p.DisplayVersion; Uninstall = $p.UninstallString }
                }
              }
            }
          }
          function Get-InstallLocation([string]$guid) {
            foreach ($hive in 'HKCU:', 'HKLM:') {
              $k = "$hive\Software\$guid"
              if (Test-Path $k) { $v = (Get-ItemProperty $k).InstallLocation; if ($v) { return "$hive $v" } }
            }
            return $null
          }
          function Show-State([string]$label) {
            Write-Host "===== $label ====="
            $e = @(Get-SeiEntries)
            Write-Host ($e | Format-Table -AutoSize | Out-String -Width 400)
            foreach ($x in $e) { Write-Host "InstallLocation[$($x.Key)]: $(Get-InstallLocation $x.Key)" }
            Write-Host "userData: $env:APPDATA\Sei exists=$(Test-Path "$env:APPDATA\Sei")"
          }
          function Stop-Sei { Get-Process -Name 'Sei' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue; Start-Sleep -Seconds 2 }
          function Test-Launch([string]$exe, [int]$seconds) {
            Stop-Sei
            $p = Start-Process -FilePath $exe -PassThru
            Start-Sleep -Seconds $seconds
            $alive = -not $p.HasExited
            $code = if ($alive) { 'running' } else { $p.ExitCode }
            Stop-Sei
            return @($alive, $code)
          }

          $userData = Join-Path $env:APPDATA 'Sei'
          $marker = Join-Path $userData 'upgrade-check-marker.txt'
          $token = [guid]::NewGuid().ToString()

          if ($env:SCENARIO -ne 'fresh') {
            $old = (Resolve-Path old\Sei-win-x64.exe).Path
            switch ($env:SCENARIO) {
              'peruser-custom'  { $instArgs = @('/S', '/D=C:\Games\My Sei') }
              { $_ -like 'permachine*' } { $instArgs = @('/S', '/allusers') }
              default { $instArgs = @('/S') }
            }
            "Installing $env:STABLE_TAG with: $($instArgs -join ' ')"
            # Bounded: without /S the old ASSISTED installer waits on its wizard
            # page forever (a scenario missing from the switch above once hung
            # the job that way).
            $p = Start-Process -FilePath $old -ArgumentList $instArgs -PassThru
            if (-not $p.WaitForExit(300000)) { $p | Stop-Process -Force; throw 'the stable installer did not finish in 5 minutes' }
            "old installer exit: $($p.ExitCode)"
            Show-State "after $env:STABLE_TAG install"
            $before = @(Get-SeiEntries)
            if ($before.Count -ne 1) { $failures += "expected 1 entry after the stable install, got $($before.Count)" }
            $oldLoc = if ($before.Count -ge 1) { Get-InstallLocation $before[0].Key } else { $null }
            $oldExe = Join-Path (($oldLoc -split ' ', 2)[1]) 'Sei.exe'
            "old exe: $oldExe"
            'Signature of the installed stable app exe:'
            $osig = Get-AuthenticodeSignature $oldExe
            $osig | Format-List Status, StatusMessage, SignatureType
            if ($osig.SignerCertificate) { $osig.SignerCertificate | Format-List Subject, Issuer, NotBefore, NotAfter }
            if ($osig.TimeStamperCertificate) { 'Timestamper:'; $osig.TimeStamperCertificate | Format-List Subject, Issuer } else { 'No timestamp countersignature.' }
            $r = Test-Launch $oldExe 25
            "old app launch: alive=$($r[0]) code=$($r[1])"
            New-Item -ItemType Directory -Force -Path $userData | Out-Null
            Set-Content -Path $marker -Value $token
            'userData contents before upgrade:'
            Get-ChildItem $userData | Select-Object Name, Length, LastWriteTime | Format-Table -AutoSize | Out-String -Width 300
          } else {
            $before = @()
            $oldLoc = $null
          }

          # HKCU try-once marker for the legacy all-users cleanup (installer.nsh).
          $migKey = 'HKCU:\Software\Sei\Installer'
          function Get-CleanupTried { if (Test-Path $migKey) { (Get-ItemProperty $migKey).LegacyAllUsersCleanupTried } else { $null } }
          if ($env:SCENARIO -eq 'permachine-tried') {
            New-Item -Path $migKey -Force | Out-Null
            New-ItemProperty -Path $migKey -Name LegacyAllUsersCleanupTried -Value '1' -PropertyType String -Force | Out-Null
          }
          $keepsLegacy = $env:SCENARIO -in @('permachine-silent', 'permachine-tried')

          $new = (Resolve-Path new\Sei-win-x64.exe).Path
          # in-app "Update Sei" = --updated --force-run (progress window); update on quit = --updated /S
          $newArgs = switch -Wildcard ($env:SCENARIO) {
            'fresh'             { @('/S') }
            'peruser-quit'      { @('--updated', '/S') }
            'permachine-silent' { @('--updated', '/S') }
            default             { @('--updated', '--force-run') }
          }
          $expectRelaunch = $newArgs -contains '--force-run'
          $expectWindow = $newArgs -notcontains '/S'

          # Enabled, on-screen buttons in the installer's top-level windows,
          # title-bar buttons excluded. The one-click progress banner has no
          # buttons; an NSIS message box or wizard page does.
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
          $uia = [System.Windows.Automation.AutomationElement]
          $btnCond = New-Object System.Windows.Automation.PropertyCondition($uia::ControlTypeProperty, [System.Windows.Automation.ControlType]::Button)
          $walker = [System.Windows.Automation.TreeWalker]::ControlViewWalker
          $script:uiaWindowsSeen = 0
          function Get-InstallerButtons([int]$procId) {
            $found = @()
            try {
              $pc = New-Object System.Windows.Automation.PropertyCondition($uia::ProcessIdProperty, $procId)
              $wins = $uia::RootElement.FindAll([System.Windows.Automation.TreeScope]::Children, $pc)
              $script:uiaWindowsSeen = [math]::Max($script:uiaWindowsSeen, $wins.Count)
              foreach ($w in $wins) {
                foreach ($b in $w.FindAll([System.Windows.Automation.TreeScope]::Descendants, $btnCond)) {
                  $parent = $walker.GetParent($b)
                  if ($parent -and $parent.Current.ControlType -eq [System.Windows.Automation.ControlType]::TitleBar) { continue }
                  if (-not $b.Current.IsOffscreen -and $b.Current.IsEnabled) { $found += "'$($w.Current.Name)' button '$($b.Current.Name)'" }
                }
              }
            } catch { }
            return $found
          }
          $shotDir = Join-Path $env:GITHUB_WORKSPACE 'shots'
          $takeShots = $env:SCENARIO -eq 'peruser-default'
          if ($takeShots) {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            New-Item -ItemType Directory -Force -Path $shotDir | Out-Null
          }
          function Shot([string]$name) {
            try {
              $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
              $g = [System.Drawing.Graphics]::FromImage($bmp)
              $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
              $bmp.Save((Join-Path $shotDir "$name.png"), [System.Drawing.Imaging.ImageFormat]::Png)
              $g.Dispose(); $bmp.Dispose()
            } catch { "screenshot failed: $_" }
          }

          if ($env:SCENARIO -eq 'peruser-running') {
            # Leave the old Sei running into the install, as the in-app restart
            # does for the moment between spawning the installer and quitting.
            Stop-Sei
            $running = Start-Process -FilePath $oldExe -PassThru
            Start-Sleep -Seconds 20
            "old Sei running before the install: $(-not $running.HasExited)"
          } else {
            Stop-Sei
          }

          "Running the one-click installer with: $($newArgs -join ' ')"
          $installStart = Get-Date
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process -FilePath $new -ArgumentList $newArgs -PassThru
          $null = $p.Handle  # cache the handle, or ExitCode reads empty without -Wait
          # Watch for (1) any visible window that is not Sei itself (split into
          # the installer's own and everything else), (2) buttons in the
          # installer's windows, and (3) Sei coming back, until the installer
          # is done and the relaunch window (60s after it exits) has passed.
          $windows = @{}
          $installerWindowAt = $null
          $buttons = @{}
          $relaunchAt = $null
          $exitedAt = $null
          $nextShot = 0
          $shotIndex = 0
          while ($true) {
            Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowHandle -ne 0 -and $_.ProcessName -ne 'Sei' } | ForEach-Object {
              $title = $_.MainWindowTitle
              if ($_.Id -eq $p.Id) {
                if ($null -eq $installerWindowAt) {
                  $installerWindowAt = $sw.Elapsed.TotalSeconds
                  "installer window after $([math]::Round($installerWindowAt, 1))s: '$title'"
                }
              } elseif ($title -match 'Sei|Setup|Install|Uninstall' -and -not $windows.ContainsKey("$($_.ProcessName): $title")) {
                $windows["$($_.ProcessName): $title"] = [math]::Round($sw.Elapsed.TotalSeconds, 1)
              }
            }
            if (-not $p.HasExited) {
              foreach ($b in (Get-InstallerButtons $p.Id)) {
                if (-not $buttons.ContainsKey($b)) { $buttons[$b] = [math]::Round($sw.Elapsed.TotalSeconds, 1) }
              }
            }
            if ($takeShots -and $null -eq $exitedAt -and $sw.Elapsed.TotalSeconds -ge $nextShot -and $shotIndex -lt 60) {
              Shot ('{0:d3}-{1:n1}s' -f $shotIndex, $sw.Elapsed.TotalSeconds)
              $shotIndex++
              $nextShot = $sw.Elapsed.TotalSeconds + 3
            }
            if ($null -eq $relaunchAt) {
              $back = Get-Process -Name 'Sei' -ErrorAction SilentlyContinue | Where-Object { try { $_.StartTime -gt $installStart } catch { $false } }
              if ($back) { $relaunchAt = $sw.Elapsed.TotalSeconds }
            }
            if ($null -eq $exitedAt -and $p.HasExited) { $exitedAt = $sw.Elapsed.TotalSeconds }
            if ($null -ne $exitedAt -and ($null -ne $relaunchAt -or $sw.Elapsed.TotalSeconds -gt $exitedAt + 60)) { break }
            if ($sw.Elapsed.TotalSeconds -gt 600) { $failures += 'installer did not finish in 10 minutes'; break }
            Start-Sleep -Milliseconds 500
          }
          "new installer exit: $($p.ExitCode) after $([int]$exitedAt)s"
          if ($p.ExitCode -ne 0) { $failures += "new installer exit code $($p.ExitCode)" }
          if ($null -ne $relaunchAt) { "Sei relaunched after $([int]$relaunchAt)s (installer start to new Sei process)" } else { 'Sei did not relaunch' }
          if ($expectRelaunch -and $null -eq $relaunchAt) { $failures += 'Sei did not reopen after an in-app restart (--force-run)' }
          if (-not $expectRelaunch -and $env:SCENARIO -ne 'fresh' -and $null -ne $relaunchAt) { $failures += 'Sei reopened after an update-on-quit install' }
          if ($takeShots) { Shot 'zz-after-relaunch' }
          if ($windows.Count -gt 0) {
            'Visible windows from other processes during the install:'
            $windows.GetEnumerator() | ForEach-Object { "  $($_.Key) at $($_.Value)s" }
            if ($env:SCENARIO -ne 'fresh') { $failures += "a window from another process showed during the update: $($windows.Keys -join '; ')" }
          } else { 'No window from another process during the install.' }
          "UI Automation saw up to $script:uiaWindowsSeen installer top-level window(s)"
          if ($buttons.Count -gt 0) {
            'Buttons in the installer windows:'
            $buttons.GetEnumerator() | ForEach-Object { "  $($_.Key) at $($_.Value)s" }
            $failures += "the installer showed something to click: $($buttons.Keys -join '; ')"
          } else { 'No buttons in the installer windows.' }
          if ($null -ne $installerWindowAt) {
            if ($expectWindow) { "progress window up after $([math]::Round($installerWindowAt, 1))s (the gap with nothing on screen)" }
            elseif ($env:SCENARIO -ne 'fresh') { $failures += "the installer showed a window during a silent update-on-quit run" }
          } elseif ($expectWindow) { $failures += 'no installer progress window during the in-app update' }
          if ($env:SCENARIO -eq 'peruser-running' -and -not $running.HasExited) { $failures += 'the old Sei was still running after the install' }
          Start-Sleep -Seconds 3
          Stop-Sei

          Show-State 'after one-click install'
          $after = @(Get-SeiEntries)
          $hklm = @($after | Where-Object { $_.Root -like 'HKLM*' })
          $hkcu = @($after | Where-Object { $_.Root -like 'HKCU*' })
          if ($keepsLegacy) {
            # The per-machine copy must be left in place (and no UAC attempted).
            if ($hkcu.Count -ne 1) { $failures += "expected 1 HKCU entry, got $($hkcu.Count)" }
            if ($hklm.Count -ne 1) { $failures += "expected the HKLM entry to be kept, got $($hklm.Count)" }
          } else {
            if ($after.Count -ne 1) { $failures += "expected exactly 1 Apps & features entry, got $($after.Count)" }
            if ($hklm.Count -ne 0) { $failures += 'an HKLM (per-machine) entry is still registered' }
          }
          if ($before.Count -ge 1 -and $hkcu.Count -ge 1 -and $before[0].Key -ne $hkcu[0].Key) {
            $failures += "uninstall key changed: $($before[0].Key) -> $($hkcu[0].Key)"
          }
          $tried = Get-CleanupTried
          "LegacyAllUsersCleanupTried: '$tried'"
          $expectTried = $env:SCENARIO -in @('permachine', 'permachine-tried')
          if ($expectTried -and $tried -ne '1') { $failures += 'try-once marker not set' }
          if (-not $expectTried -and $tried) { $failures += "try-once marker set unexpectedly ('$tried')" }
          # Get-InstallLocation reads HKCU first, i.e. the new per-user install.
          $newLoc = if ($hkcu.Count -ge 1) { Get-InstallLocation $hkcu[0].Key } else { $null }
          "install location before: $oldLoc"
          "install location after:  $newLoc"
          if ($env:SCENARIO -like 'peruser-*' -and $oldLoc -ne $newLoc) { $failures += 'per-user install location changed' }
          if ($env:SCENARIO -eq 'permachine') {
            $pf = Join-Path $env:ProgramFiles 'Sei'
            "Program Files\Sei exists: $(Test-Path $pf)"
            if (Test-Path (Join-Path $pf 'Sei.exe')) { $failures += 'the per-machine copy is still in Program Files' }
          }
          if ($keepsLegacy) {
            $pf = Join-Path $env:ProgramFiles 'Sei'
            if (-not (Test-Path (Join-Path $pf 'Sei.exe'))) { $failures += 'the per-machine copy was removed although cleanup should have been skipped' }
          }
          'Shortcuts:'
          foreach ($d in @([Environment]::GetFolderPath('Desktop'), [Environment]::GetFolderPath('CommonDesktopDirectory'), (Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs'), (Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs'))) {
            Get-ChildItem -Path $d -Filter 'Sei*.lnk' -ErrorAction SilentlyContinue | ForEach-Object { "  $($_.FullName)" }
          }

          if ($env:SCENARIO -ne 'fresh') {
            if (-not (Test-Path $marker)) { $failures += 'userData marker is gone' }
            elseif ((Get-Content $marker -Raw).Trim() -ne $token) { $failures += 'userData marker content changed' }
            else { 'userData marker intact' }
          }

          $exe = Join-Path (($newLoc -split ' ', 2)[1]) 'Sei.exe'
          "new exe: $exe"
          $r = Test-Launch $exe 30
          "upgraded app launch: alive=$($r[0]) code=$($r[1])"
          if (-not $r[0]) { $failures += "Sei.exe exited early with code $($r[1])" }

          $im = Join-Path $userData 'install-marker.json'
          if (Test-Path $im) { 'install-marker.json:'; Get-Content $im -Raw } else { 'install-marker.json missing' }
          $expectKind = if ($env:SCENARIO -eq 'fresh') { 'fresh' } else { 'upgrade' }
          if (-not (Test-Path $im) -or -not ((Get-Content $im -Raw) -match "`"kind`":\s*`"$expectKind`"")) {
            $failures += "install-marker.json kind is not '$expectKind'"
          }
          $logDir = Join-Path $userData 'logs'
          if (Test-Path $logDir) {
            '--- app logs (install marker lines) ---'
            Get-ChildItem $logDir -File -Recurse | Select-String -Pattern 'install marker|installer_first_launch' | Select-Object -First 10 | ForEach-Object { "$($_.Filename): $($_.Line)" }
          }

          if ($env:SCENARIO -ne 'fresh') {
            'Signature of the installed app exe:'
            $sig = Get-AuthenticodeSignature $exe
            $sig | Format-List Status, StatusMessage
          }

          if ($failures.Count -gt 0) {
            '::group::FAILURES'
            $failures | ForEach-Object { "::error::$_" }
            '::endgroup::'
            exit 1
          }
          "PASS: $env:SCENARIO"

      - name: Upload in-app update screenshots
        if: always() && matrix.scenario == 'peruser-default'
        uses: actions/upload-artifact@v4
        with:
          name: oneclick-upgrade-shots
          path: shots
          if-no-files-found: ignore
          retention-days: 3

  # What a person sees: the one-click installer run NON-silently on a clean
  # runner, with a screenshot about every 1.5 s until it exits, and the time to
  # its first visible window. The runner session is interactive enough for
  # CopyFromScreen; if the frames come out black, the timing still stands.
  ui:
    needs: build
    if: inputs.suite != 'progress' && inputs.suite != 'preview'
    runs-on: windows-latest
    steps:
      - name: Download new installer
        uses: actions/download-artifact@v4
        with:
          name: oneclick-installer
          path: new

      - name: Interactive one-click install with screenshots
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory -Force -Path shots | Out-Null
          function Shot([string]$name) {
            try {
              $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
              $g = [System.Drawing.Graphics]::FromImage($bmp)
              $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
              $bmp.Save((Join-Path shots "$name.png"), [System.Drawing.Imaging.ImageFormat]::Png)
              $g.Dispose(); $bmp.Dispose()
            } catch { "screenshot failed: $_" }
          }
          $exe = (Resolve-Path new\Sei-win-x64.exe).Path
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process -FilePath $exe -PassThru
          $firstWindow = $null
          $i = 0
          while (-not $p.HasExited -and $sw.Elapsed.TotalSeconds -lt 300) {
            $p.Refresh()
            if ($null -eq $firstWindow -and $p.MainWindowHandle -ne 0) {
              $firstWindow = $sw.Elapsed.TotalSeconds
              "first installer window after $([math]::Round($firstWindow, 1))s: '$($p.MainWindowTitle)'"
            }
            Shot ('{0:d3}-{1:n1}s' -f $i, $sw.Elapsed.TotalSeconds)
            $i++
            Start-Sleep -Milliseconds 1500
          }
          "installer exited: $($p.HasExited) code=$(if ($p.HasExited) { $p.ExitCode } else { 'n/a' }) after $([int]$sw.Elapsed.TotalSeconds)s"
          Start-Sleep -Seconds 8
          Shot 'zz-after-run'
          $sei = Get-Process -Name 'Sei' -ErrorAction SilentlyContinue
          "Sei running after install (runAfterFinish): $([bool]$sei)"
          $sei | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oneclick-ui-shots
          path: shots
          retention-days: 3

  # Sei's update progress window over the real installer (see the header).
  progress-upgrade:
    needs: build
    if: inputs.suite != 'preview'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Bundle the launcher driver
        shell: bash
        run: npx --yes esbuild@0.25.12 scripts/ci/update-progress-launch.ts --bundle --platform=node --outfile=upl.cjs

      - name: Install ffmpeg
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg -y --no-progress | Select-Object -Last 3 }
          ffmpeg -hide_banner -version | Select-Object -First 1

      - name: Download new installer
        uses: actions/download-artifact@v4
        with:
          name: oneclick-installer
          path: new

      # From the newest one-click stable (STABLE_TAG is the old assisted
      # installer, for the migration scenarios above): the in-app update only
      # ever runs from a one-click install.
      - name: Download stable installer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = gh release list -R $env:GITHUB_REPOSITORY --exclude-drafts --exclude-pre-releases -L 1 --json tagName -q '.[0].tagName'
          "upgrading from $tag"
          gh release download $tag -R $env:GITHUB_REPOSITORY -p 'Sei-win-x64.exe' -D old

      - name: Update under the progress window (recorded)
        shell: powershell
        run: |
          & .\scripts\ci\update-progress-check.ps1 -Mode upgrade -Theme midnight -Lang en -NewInstaller new\Sei-win-x64.exe -OldInstaller old\Sei-win-x64.exe -OutDir progress-out
          exit $LASTEXITCODE

      - name: Upload video and stills
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-progress-upgrade
          path: progress-out
          if-no-files-found: ignore
          retention-days: 7

  progress-preview:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: midnight-en, theme: midnight, lang: en, seconds: 100, history: '', reduced: false, blocked: false }
          - { variant: ice-zh, theme: ice, lang: zh, seconds: 60, history: '60', reduced: false, blocked: false }
          - { variant: acorn-en-reduced-motion, theme: acorn, lang: en, seconds: 50, history: '50', reduced: true, blocked: false }
          - { variant: mint-zh-late, theme: mint, lang: zh, seconds: 90, history: '45', reduced: false, blocked: false }
          - { variant: blocked-fallback, theme: midnight, lang: en, seconds: 30, history: '', reduced: false, blocked: true }
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Bundle the launcher driver
        shell: bash
        run: npx --yes esbuild@0.25.12 scripts/ci/update-progress-launch.ts --bundle --platform=node --outfile=upl.cjs

      - name: Install ffmpeg
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg -y --no-progress | Select-Object -Last 3 }
          ffmpeg -hide_banner -version | Select-Object -First 1

      - name: Progress window over a stand-in install (recorded)
        shell: powershell
        run: |
          $a = @{ Mode = 'preview'; Theme = '${{ matrix.theme }}'; Lang = '${{ matrix.lang }}'; FakeInstallSeconds = ${{ matrix.seconds }}; History = '${{ matrix.history }}'; OutDir = 'progress-out' }
          if ('${{ matrix.reduced }}' -eq 'true') { $a.ReducedMotion = $true }
          if ('${{ matrix.blocked }}' -eq 'true') { $a.Blocked = $true }
          & .\scripts\ci\update-progress-check.ps1 @a
          exit $LASTEXITCODE

      - name: Upload video and stills
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-progress-${{ matrix.variant }}
          path: progress-out
          if-no-files-found: ignore
          retention-days: 7
