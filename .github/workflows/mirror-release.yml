# china-compat W8 (260816): mirror published release assets to R2 (dl.sei.gg)
# so the auto-updater has a feed reachable from mainland China (GitHub's
# release-asset CDN is unreliable there; jsDelivr is blocked outright).
#
# Triggers on RELEASE PUBLISHED, not on tag push, deliberately: release.yml
# creates a DRAFT for human review, and an aborted draft must never leave the
# mirror serving a version GitHub never shipped. workflow_dispatch exists for
# backfilling an already-published release by tag.
#
# Layout in the bucket (260909 — channel-separated; the old flat layout let a
# beta publish overwrite BOTH the stable feed ymls and the same-named
# artifacts, so stable mirror clients were offered the beta or failed the
# sha512 check, and beta clients' beta-mac.yml 404ed since it was never
# written at all):
#   updates/latest*.yml            stable feed (urls point into stable/)
#   updates/beta*.yml              beta feed  (urls point into beta/)
#   updates/stable/<artifacts>     stable artifacts + blockmaps
#   updates/beta/<artifacts>       beta artifacts + blockmaps
# electron-updater's generic provider resolves a feed yml's relative `url:`
# against the feed base (https://dl.sei.gg/updates/), so "stable/Sei-mac-
# arm64.zip" fetches updates/stable/Sei-mac-arm64.zip — no client change
# needed: shipped stable clients request latest-mac.yml, shipped beta clients
# request beta-mac.yml (updater.ts sets the channel), and each now gets its
# own consistent feed + files.
#
# A STABLE publish also writes the beta*.yml names (pointing at the stable):
# a stable newer than every beta graduates mirror beta clients onto it, the
# same as the GitHub feed. Publish order defines the winner, so like the
# GitHub channel, cut or re-publish a beta after any stable release (see the
# beta-feed-ordering rule) or mirror beta clients idle on the stale entry.
#
# No-op until the three R2_* secrets exist (create an R2 API token scoped to
# the bucket; account id is in the dashboard URL). The step fails loudly if
# only some are set, silently skips if none are.
name: Mirror release to R2

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to mirror (e.g. v0.7.0)'
        required: true

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag + channel
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          tag="${EVENT_TAG:-$INPUT_TAG}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # Channel from the release's own prerelease flag (covers the
          # workflow_dispatch backfill too, where the event carries none).
          pre=$(gh release view "$tag" --repo "${{ github.repository }}" \
            --json isPrerelease --jq .isPrerelease)
          if [ "$pre" = "true" ]; then channel=beta; else channel=stable; fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "Mirroring $tag as channel=$channel"

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets
          gh release download "${{ steps.tag.outputs.tag }}" \
            --repo "${{ github.repository }}" --dir assets
          ls -la assets/

      - name: Upload to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          CHANNEL: ${{ steps.tag.outputs.channel }}
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] && [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "R2 secrets not configured; skipping mirror upload."
            exit 0
          fi
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::error::Partial R2 configuration. Set all of R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY."
            exit 1
          fi
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          shopt -s nullglob
          # Artifacts into the channel dir FIRST, feed ymls flat LAST: a
          # client that reads a new yml before its artifacts exist would 404
          # the download; artifacts-first makes the swap atomic from the
          # updater's point of view.
          for f in assets/*; do
            case "$f" in *.yml) continue;; esac
            aws s3 cp "$f" "s3://sei-dl/updates/$CHANNEL/$(basename "$f")" --endpoint-url "$endpoint"
          done
          # Point every artifact ref in the ymls at the channel dir. Rewrites
          # only the `- url:` entries and the legacy top-level `path:`; sha512
          # and size lines are untouched.
          for f in assets/*.yml; do
            sed -E -i "s|^([[:space:]]*- url: )|\\1$CHANNEL/|; s|^(path: )|\\1$CHANNEL/|" "$f"
          done
          for f in assets/*.yml; do
            base="$(basename "$f")"
            if [ "$CHANNEL" = "beta" ]; then
              # electron-builder always names the ymls latest*; the beta
              # channel's clients request beta*.yml, so rename on upload.
              aws s3 cp "$f" "s3://sei-dl/updates/${base/latest/beta}" --endpoint-url "$endpoint"
            else
              aws s3 cp "$f" "s3://sei-dl/updates/$base" --endpoint-url "$endpoint"
              # A stable also refreshes the beta feed names (see header note).
              aws s3 cp "$f" "s3://sei-dl/updates/${base/latest/beta}" --endpoint-url "$endpoint"
            fi
          done
          echo "Mirrored ${{ steps.tag.outputs.tag }} ($CHANNEL) to r2://sei-dl/updates/"
