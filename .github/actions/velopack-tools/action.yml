name: Velopack tools
description: >-
  Builds Sei's patched Velopack Update.exe (build/velopack/README.md), installs
  the matching vpk and puts the patched Update.exe in vpk's vendor folder, so
  every package vpk packs carries it. Windows runners only. Shared by
  release.yml and velopack-update.yml.
inputs:
  velopack-commit:
    description: Upstream Velopack commit the patch applies to.
    default: '8d2844f324a69bd848719ef465b1ae12c5060524'
  vpk-version:
    description: The vpk release built from that commit.
    default: '1.3.39-g8d2844f'
runs:
  using: composite
  steps:
    - name: Clone Velopack and apply Sei's patch
      shell: bash
      env:
        VELOPACK_COMMIT: ${{ inputs.velopack-commit }}
      run: |
        set -euo pipefail
        # The patch must apply byte for byte: no CRLF conversion in this clone
        # (the patch itself is checked out as-is, see .gitattributes).
        git config --global core.autocrlf false
        VELO="$RUNNER_TEMP/velo"
        rm -rf "$VELO"
        git init -q "$VELO"
        git -C "$VELO" remote add origin https://github.com/velopack/velopack
        git -C "$VELO" fetch -q --depth 1 origin "$VELOPACK_COMMIT"
        git -C "$VELO" checkout -q FETCH_HEAD
        git -C "$VELO" apply --verbose "$GITHUB_WORKSPACE/build/velopack/sei-fast-apply.patch"
        sed -i 's/^version = "0.0.0-local"/version = "1.3.39-sei"/' "$VELO/Cargo.toml"
        git -C "$VELO" diff --stat

    - name: Rust target
      shell: bash
      run: rustup target add x86_64-pc-windows-msvc

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: ${{ runner.temp }}/velo -> target
        key: sei-update-exe

    - name: Build Update.exe
      shell: bash
      env:
        RUSTFLAGS: -C target-feature=+crt-static
      run: |
        set -euo pipefail
        cd "$RUNNER_TEMP/velo"
        cargo build --target x86_64-pc-windows-msvc --features windows --release -p velopack_bins --bin update
        ls -la target/x86_64-pc-windows-msvc/release/update.exe

    - name: Setup .NET (vpk)
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Install vpk with Sei's Update.exe
      shell: bash
      env:
        VPK_VERSION: ${{ inputs.vpk-version }}
      run: |
        set -euo pipefail
        dotnet tool install -g vpk --version "$VPK_VERSION"
        VENDOR=$(find "$USERPROFILE/.dotnet/tools/.store/vpk" -type d -name vendor | head -1)
        [ -n "$VENDOR" ] || { echo "::error::vpk vendor folder not found"; exit 1; }
        for f in update.exe update_x64.exe; do
          cp "$RUNNER_TEMP/velo/target/x86_64-pc-windows-msvc/release/update.exe" "$VENDOR/$f"
        done
        ls -la "$VENDOR"
        echo "--- vpk pack options, hidden ones included ---"
        vpk --skip-updates pack -H || true
