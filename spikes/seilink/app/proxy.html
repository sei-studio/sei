<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>SeiLink hit proxy</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:transparent;font:bold 20px sans-serif;color:#000}
#p{position:absolute;inset:0;background:rgba(255,210,0,.6);display:flex;align-items:center;justify-content:center;text-align:center}
</style>
</head>
<body>
<div id="p">HIT PROXY<br>clicks: <span id="n">0</span></div>
<script>
// Spike-only visible proxy (production would be transparent). Counts real mouse-downs.
const { ipcRenderer } = require('electron')
let n = 0
addEventListener('mousedown', (e) => {
  n++; document.getElementById('n').textContent = n
  ipcRenderer.send('proxy-click', { n, x: e.screenX, y: e.screenY, button: e.button, t: Date.now() })
})
</script>
</body>
</html>
