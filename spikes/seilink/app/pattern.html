<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>SeiLink spike pattern</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#ff00ff}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Test pattern only: magenta field, moving green square, frame counter. Colors are R/B-symmetric
// so the screenshot analyzer does not care about BGRA vs RGBA.
const { ipcRenderer } = require('electron')
const variant = new URLSearchParams(location.search).get('variant') || '?'
const c = document.getElementById('c')
const g = c.getContext('2d')
let frames = 0, last = performance.now(), lastFrames = 0, fps = 0, sq = { x: 0, y: 0 }
function size() {
  const d = devicePixelRatio || 1
  c.width = innerWidth * d; c.height = innerHeight * d
  c.style.width = innerWidth + 'px'; c.style.height = innerHeight + 'px'
  g.setTransform(d, 0, 0, d, 0, 0)
}
addEventListener('resize', size); size()
function tick(now) {
  frames++
  const W = innerWidth, H = innerHeight, S = 180
  g.fillStyle = '#ff00ff'; g.fillRect(0, 0, W, H)
  const t = now / 1000
  sq.x = (W - S) * (0.5 + 0.45 * Math.sin(t * 1.3))
  sq.y = (H - S) * (0.5 + 0.45 * Math.sin(t * 0.9 + 1))
  g.fillStyle = '#00ff00'; g.fillRect(sq.x, sq.y, S, S)
  // Ticker: a green block sliding along a band near the bottom (y 79%..89%), so the pixel check has
  // a region that runner console windows and the icon column do not cover.
  const TW = 140, by = H * 0.79, bh = H * 0.1
  g.fillStyle = '#00ff00'; g.fillRect((W - TW) * (0.5 + 0.48 * Math.sin(t * 2.2)), by, TW, bh)
  g.fillStyle = '#ffffff'; g.font = 'bold 44px sans-serif'
  g.fillText(`SEILINK ${variant}`, W * 0.3, H * 0.18)
  g.fillText(`frame ${frames}   ${fps.toFixed(0)} fps`, W * 0.3, H * 0.18 + 56)
  requestAnimationFrame(tick)
}
requestAnimationFrame(tick)
setInterval(() => {
  const now = performance.now()
  fps = ((frames - lastFrames) * 1000) / (now - last)
  last = now; lastFrames = frames
  ipcRenderer.send('frame', { role: 'room', frames, fps, sq, vis: document.visibilityState, t: Date.now() })
}, 1000)
</script>
</body>
</html>
